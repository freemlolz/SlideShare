  <rect x="669" y="81" width="314" height="180" rx="7" fill="url(#slide)"/>
  <path d="M704 114h30" stroke="#a8bfff" stroke-width="4"/>
  <text x="704" y="166" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="white">Same slide.</text>
  <text x="704" y="202" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="white">Shared moment.</text>
