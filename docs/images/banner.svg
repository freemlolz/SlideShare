  <text x="104" y="72" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#b8c7e8">PRESENT TOGETHER</text>
  <text x="50" y="155" font-family="Arial, sans-serif" font-size="59" font-weight="700" letter-spacing="-2" fill="#ffffff">SlideSync Local</text>
  <text x="53" y="201" font-family="Arial, sans-serif" font-size="25" fill="#c6d3ed">One deck. Every screen.</text>
  <text x="53" y="242" font-family="Arial, sans-serif" font-size="17" fill="#8f9fbd">PDF slides, synced over Wi-Fi.</text>
  <rect x="52" y="278" width="68" height="26" rx="6" fill="#263452"/>
  <rect x="130" y="278" width="103" height="26" rx="6" fill="#263452"/>
  <rect x="243" y="278" width="101" height="26" rx="6" fill="#263452"/>
