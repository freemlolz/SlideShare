  <text x="181" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#d2dcf1">NO INSTALLS</text>
  <text x="293" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#d2dcf1">NO CLOUD</text>
