<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">SlideSync Local</title>
  <desc id="desc">One deck, every screen. A laptop shares a presentation with two phone browsers over Wi-Fi.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a30"/><stop offset="1" stop-color="#192440"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#2368e8"/><stop offset="0.6" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f0528a"/></linearGradient>
    <linearGradient id="slide" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263d75"/><stop offset="1" stop-color="#6546a7"/></linearGradient>
  </defs>
  <rect width="1200" height="350" rx="18" fill="url(#backdrop)"/>
  <path d="M920 0h280v350H760z" fill="url(#accent)" opacity="0.13"/>
  <path d="M1065 0h135v350H905z" fill="url(#accent)" opacity="0.18"/>
